<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CocoTech layer models</title>
<link rel="icon" href="assets/favicon.svg">
<style>
@font-face { font-family: Manrope; src: url(assets/manrope.ttf) format("truetype"); font-weight: 400; }
@font-face { font-family: Manrope; src: url(assets/manrope-bold.ttf) format("truetype"); font-weight: 600 800; }
@font-face { font-family: Plex; src: url(assets/plex-mono.ttf) format("truetype"); }
:root { --paper: #eeede6; --ink: #262923; --muted: #626457; --line: #c9c9bc; --accent: #d7d8ab; --rust: #855333; --white: #f8f7f1; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: Manrope, system-ui, sans-serif; display: grid; grid-template-columns: 1fr 370px; height: 100vh; overflow: hidden; }
.mono { font-family: Plex, ui-monospace, monospace; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
#stage { position: relative; min-height: 0; min-width: 0; }
#stage > canvas { display: block; cursor: grab; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.tag { pointer-events: auto; font: 11px Plex, ui-monospace, monospace; text-transform: uppercase; letter-spacing: .04em; background: var(--white); color: var(--ink); border: 1px solid var(--ink); padding: 4px 7px; cursor: pointer; white-space: nowrap; transition: opacity .2s; }
.tag.on { background: var(--ink); color: var(--white); }
.corner { position: absolute; left: 16px; bottom: 14px; color: var(--muted); pointer-events: none; }
aside > * { flex-shrink: 0; }
aside { border-left: 1px solid var(--line); background: var(--white); padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; }
h1 { font-size: 24px; line-height: 1.15; margin: 0; }
h2 { font-size: 18px; margin: 0 0 4px; }
p { margin: 0; line-height: 1.55; font-size: 14px; color: var(--muted); }
button { font: inherit; color: inherit; }
.switch { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); }
.switch button { border: 0; background: none; padding: 10px; cursor: pointer; font-weight: 600; font-size: 14px; }
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--white); }
.row { display: flex; align-items: center; gap: 12px; }
input[type=range] { flex: 1; accent-color: var(--rust); }
.plain[aria-pressed="true"] { background: var(--ink); color: var(--white); }
.plain { border: 1px solid var(--ink); background: none; padding: 7px 12px; cursor: pointer; font-size: 13px; }
ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
ol button { width: 100%; display: grid; grid-template-columns: 26px 18px 1fr; gap: 10px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 11px 4px; cursor: pointer; font-size: 14px; }
ol button small { display: block; color: var(--muted); font-size: 12px; }
ol button[aria-pressed="true"] { background: var(--accent); }
.sw { width: 18px; height: 18px; border: 1px solid var(--ink); }
#detail { border: 1px solid var(--line); padding: 16px; min-height: 140px; }
#detail .mono { color: var(--rust); margin-bottom: 8px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid var(--ink); }
.note { font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
@media (max-width: 820px) {
  body { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; overflow: auto; }
  aside > * { flex-shrink: 0; }
aside { border-left: 0; border-top: 1px solid var(--line); padding: 20px 16px; }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<main id="stage">
  <span class="corner mono">Drag to rotate · scroll to zoom · click a layer</span>
</main>
<aside>
  <div>
    <div class="mono" style="color:var(--muted);margin-bottom:6px">CocoTech / layer models</div>
    <h1 id="title"></h1>
  </div>
  <div class="switch" role="group" aria-label="Model">
    <button data-model="supercap" aria-pressed="true">Supercapacitor</button>
    <button data-model="panel" aria-pressed="false">Acoustic panel</button>
  </div>
  <div>
    <label class="mono" for="explode">Layer separation</label>
    <div class="row" style="margin-top:8px">
      <input id="explode" type="range" min="0" max="1" step="0.01" value="1">
      <button class="plain" id="toggle">Collapse</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="plain" id="spin" aria-pressed="false">Auto-rotate</button>
      <button class="plain" id="reset">Reset view</button>
    </div>
  </div>
  <ol id="list"></ol>
  <div id="detail" aria-live="polite"></div>
  <div class="legend mono" id="legend"></div>
  <p class="note">Schematic, not to scale. Layer thicknesses are exaggerated so each one is visible. Layers and process stages come from the project's research notes (research.js); no measured dimensions or results exist yet.</p>
</aside>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.prepend(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.className = "labels";
stage.append(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#eeede6");
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight("#ffffff", 1.3);
sun.position.set(4, 9, 6);
scene.add(sun);
const back = new THREE.DirectionalLight("#ffffff", 0.8);
back.position.set(-5, -4, -6);
scene.add(back, new THREE.HemisphereLight("#ffffff", "#c9c9bc", 1.1));
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 4;
controls.maxDistance = 26;
controls.autoRotateSpeed = 1.5;

// ---------- procedural textures ----------
const rnd = (a, b) => a + Math.random() * (b - a);
function tex(size, draw, repeat = 1) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const dots = (g, s, n, color, r0, r1) => {
  g.fillStyle = color;
  for (let i = 0; i < n; i++) { g.beginPath(); g.arc(rnd(0, s), rnd(0, s), rnd(r0, r1), 0, 7); g.fill(); }
};
const carbonTex = tex(512, (g, s) => {
  g.fillStyle = "#232521"; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) { const v = rnd(25, 95) | 0; dots(g, s, 1, `rgb(${v},${v},${v - 3})`, 0.5, 2.4); }
  dots(g, s, 600, "#0b0c0a", 1.5, 4.5);
}, 2);
const fiberTex = tex(1024, (g, s) => {
  g.fillStyle = "#6f4527"; g.fillRect(0, 0, s, s);
  const cols = ["#a87644", "#5e3a20", "#c79a63", "#8a5a34", "#3f2716", "#b5834e"];
  for (let i = 0; i < 5200; i++) {
    const x = rnd(0, s), y = rnd(0, s), a = rnd(0, Math.PI), L = rnd(25, 110);
    g.strokeStyle = cols[i % cols.length]; g.globalAlpha = rnd(0.55, 0.95); g.lineWidth = rnd(0.8, 2.6);
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a + 0.4) * L / 2 + rnd(-12, 12), y + Math.sin(a + 0.4) * L / 2 + rnd(-12, 12), x + Math.cos(a) * L, y + Math.sin(a) * L);
    g.stroke();
  }
  g.globalAlpha = 0.35; dots(g, s, 900, "#e2d3a8", 0.8, 2.2); // binder specks
  g.globalAlpha = 1;
}, 1);
const fabricTex = tex(256, (g, s) => {
  g.fillStyle = "#bdb9a2"; g.fillRect(0, 0, s, s);
  const c = 8;
  for (let y = 0; y < s; y += c) for (let x = 0; x < s; x += c) {
    const over = ((x + y) / c) % 2 === 0;
    g.fillStyle = over ? "#d3cfb8" : "#a8a48d";
    over ? g.fillRect(x + 1, y + 2, c - 2, c - 4) : g.fillRect(x + 2, y + 1, c - 4, c - 2);
  }
}, 10);
const separatorTex = tex(256, (g, s) => { g.fillStyle = "#f3f2ea"; g.fillRect(0, 0, s, s); dots(g, s, 2500, "#d6d4c8", 0.4, 1.4); }, 3);
const wallTex = tex(256, (g, s) => { g.fillStyle = "#dedcd1"; g.fillRect(0, 0, s, s); dots(g, s, 3000, "#d2d0c4", 0.5, 1.8); }, 3);

const mats = {
  metal: () => new THREE.MeshStandardMaterial({ color: "#dfe2e4", metalness: 0.85, roughness: 0.38 }),
  carbon: () => new THREE.MeshStandardMaterial({ map: carbonTex, bumpMap: carbonTex, bumpScale: 2, roughness: 0.95 }),
  separator: () => new THREE.MeshStandardMaterial({ map: separatorTex, roughness: 0.9, transparent: true, opacity: 0.88 }),
  fiber: () => new THREE.MeshStandardMaterial({ map: fiberTex, bumpMap: fiberTex, bumpScale: 4, roughness: 1 }),
  fabric: () => new THREE.MeshStandardMaterial({ map: fabricTex, bumpMap: fabricTex, bumpScale: 1.5, roughness: 1 }),
  wall: () => new THREE.MeshStandardMaterial({ map: wallTex, roughness: 1 }),
};

// ---------- layer extras ----------
const CATION = "#c4622c", ANION = "#e6e7b0";
const ionGeo = new THREE.SphereGeometry(0.045, 12, 8);
function ions(g, n, color, place) {
  const m = new THREE.InstancedMesh(ionGeo, new THREE.MeshStandardMaterial({ color, roughness: 0.4 }), n);
  const M = new THREE.Matrix4();
  for (let i = 0; i < n; i++) { M.setPosition(...place()); m.setMatrixAt(i, M); }
  g.add(m);
}
// counter-ions lined up on the electrode face that meets the separator (the double layer)
const ionSheet = (color, side) => (g, w, d, t) =>
  ions(g, 170, color, () => [rnd(-w / 2 + 0.08, w / 2 - 0.08), side * (t / 2 + 0.05), rnd(-d / 2 + 0.08, d / 2 - 0.08)]);
const tab = (side) => (g, w, d, t) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.6, t, 0.7), g.children[0].material);
  m.position.set(side * (w / 2 + 0.3), 0, -d / 4);
  g.add(m);
};

// ---------- model specs (bottom/back layer first) ----------
const models = {
  supercap: {
    title: "Supercapacitor test cell",
    w: 4, d: 2.8, gap: 0.6, labelZ: 1.4, cam: [6.2, 5.4, 8.6],
    legend: [[CATION, "Positive ions"], [ANION, "Negative ions"]],
    intro: "A symmetric electric double-layer cell built around the shell-derived activated carbon (CT-02, stages 09 and 10). Shown charged: ions from the electrolyte crowd onto the electrode surfaces.",
    layers: [
      { name: "Current collector (−)", sub: "Conductive metal foil + tab", t: 0.05, mat: "metal", swatch: "#c9cdd1", extra: tab(-1),
        desc: "Carries electrons between the carbon electrode and the outside circuit. The project only specifies \"a suitable current collector\"; it is drawn here as a metal foil with a terminal tab." },
      { name: "Negative electrode", sub: "Coconut-shell activated carbon", t: 0.26, mat: "carbon", swatch: "#2b2d29", extra: ionSheet(CATION, 1),
        desc: "Activated carbon from coconut shell, mixed into an electrode formulation and coated onto the collector (stage 09). When charged, positive ions from the electrolyte gather on its accessible pore surfaces. Charge is held at that interface, not by a chemical reaction." },
      { name: "Separator + electrolyte", sub: "Porous insulating membrane", t: 0.1, mat: "separator", swatch: "#f3f2ea",
        extra: (g, w, d, t) => {
          const p = () => [rnd(-w / 2 + 0.1, w / 2 - 0.1), rnd(-t / 2, t / 2), rnd(-d / 2 + 0.1, d / 2 - 0.1)];
          ions(g, 40, CATION, p); ions(g, 40, ANION, p);
        },
        desc: "A porous, electrically insulating membrane soaked in electrolyte (stage 10). It keeps the two electrodes from touching while letting ions move between them. Electrolyte type is still a test variable." },
      { name: "Positive electrode", sub: "Coconut-shell activated carbon", t: 0.26, mat: "carbon", swatch: "#2b2d29", extra: ionSheet(ANION, -1),
        desc: "The same activated-carbon electrode as the negative side, which makes the cell symmetric. When charged, negative ions gather on its surface (underside, facing the separator; orbit below to see them)." },
      { name: "Current collector (+)", sub: "Conductive metal foil + tab", t: 0.05, mat: "metal", swatch: "#c9cdd1", extra: tab(1),
        desc: "Second current collector and terminal. Its tab exits on the opposite side so the two terminals can't short." },
    ],
  },
  panel: {
    title: "Coir acoustic panel",
    w: 4.8, d: 3.2, gap: 1.5, labelZ: -1.6, rot: Math.PI / 2, cam: [7, 3.6, 13.5],
    legend: [],
    intro: "A coir-fiber absorption panel (CT-01) seen wall-mounted. The project designs it to absorb sound and cut echo, not to fully soundproof a room.",
    layers: [
      { name: "Wall (context)", sub: "Mounting surface, not part of the panel", t: 0.12, w: 6.4, d: 4.6, mat: "wall", swatch: "#dedcd1",
        desc: "Shown only for orientation. How a panel is mounted changes its measured absorption, so test reports must state it." },
      { name: "Coir fiber core", sub: "Coir fiber + bio-based binder, compressed", t: 0.6, mat: "fiber", swatch: "#8a5a34",
        desc: "Husk fibers that have been extracted, dried, treated, cut to length, mixed with a bio-based binder, moulded, compressed and cured (stages 03 to 10). The open voids between fibers let air move through and dissipate some sound energy. Thickness, density, fiber size and binder ratio are the tuning variables." },
      { name: "Fabric facing", sub: "Dust-resistant breathable fabric", t: 0.04, mat: "fabric", swatch: "#bdb9a2",
        desc: "The finishing layer (stage 11). It has to stay breathable so sound still reaches the fiber core; its effect on absorption is part of testing." },
    ],
  },
};

// ---------- build ----------
const lineMat = new THREE.LineBasicMaterial({ color: "#262923" });
for (const spec of Object.values(models)) {
  spec.root = new THREE.Group();
  spec.root.rotation.x = spec.rot || 0;
  spec.root.position.x = -1;
  const maxW = Math.max(...spec.layers.map((L) => L.w ?? spec.w));
  spec.layers.forEach((L, i) => {
    const g = new THREE.Group();
    const w = L.w ?? spec.w, d = L.d ?? spec.d, z = Math.sign(spec.labelZ) * d / 2;
    g.add(new THREE.Mesh(new THREE.BoxGeometry(w, L.t, d), mats[L.mat]()));
    L.extra?.(g, w, d, L.t);
    const x1 = maxW / 2 + 0.9;
    L.leader = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(w / 2, 0, z), new THREE.Vector3(x1, 0, z)]), lineMat);
    g.add(L.leader);
    L.el = document.createElement("button");
    L.el.className = "tag";
    L.el.textContent = `${String(spec.layers.length - i).padStart(2, "0")} ${L.name}`;
    L.el.onclick = () => select(i);
    const label = new CSS2DObject(L.el);
    label.position.set(x1, 0, z);
    label.center.set(0, 0.5);
    g.add(label);
    g.traverse((o) => {
      o.userData.layer = i;
      if (o.material && o.material !== lineMat) Object.assign(o.material.userData, { o: o.material.opacity, t: o.material.transparent });
    });
    L.g = g;
    spec.root.add(g);
  });
}

// ---------- UI ----------
let current, selected = null, explode = 1, target = 1;
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function show(key) {
  if (current) { scene.remove(current.root); current.layers.forEach((L) => (L.el.style.display = "none")); }
  current = models[key];
  scene.add(current.root);
  current.layers.forEach((L) => (L.el.style.display = ""));
  document.querySelectorAll("[data-model]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.model === key));
  $("title").textContent = current.title;
  $("list").innerHTML = "";
  [...current.layers].reverse().forEach((L) => {
    const i = current.layers.indexOf(L), li = document.createElement("li"), b = document.createElement("button");
    b.innerHTML = `<span class="mono">${String(current.layers.length - i).padStart(2, "0")}</span><span class="sw" style="background:${L.swatch}"></span><span>${L.name}<small>${L.sub}</small></span>`;
    b.onclick = () => select(selected === i ? null : i);
    L.btn = b;
    li.append(b);
    $("list").append(li);
  });
  $("legend").innerHTML = current.legend.map(([c, n]) => `<span><i style="background:${c}"></i>${n}</span>`).join("");
  camera.position.set(...current.cam);
  controls.target.set(-0.4, 0, 0);
  select(null);
}

function select(i) {
  selected = i;
  current.layers.forEach((L, j) => {
    const dim = i !== null && j !== i;
    L.g.traverse((o) => {
      const m = o.material;
      if (!m || m === lineMat) return;
      m.transparent = dim || m.userData.t;
      m.opacity = dim ? 0.12 : m.userData.o;
      m.depthWrite = !dim;
    });
    L.el.classList.toggle("on", j === i);
    L.btn.setAttribute("aria-pressed", j === i);
  });
  const L = current.layers[i];
  $("detail").innerHTML = L
    ? `<div class="mono">Layer ${String(current.layers.length - i).padStart(2, "0")} / ${L.sub}</div><h2>${L.name}</h2><p>${L.desc}</p>`
    : `<p>${current.intro}</p><p style="margin-top:10px">Click a layer in the model or the list to isolate it.</p>`;
}

function layout() {
  const { layers, gap } = current;
  const total = layers.reduce((s, L) => s + L.t, 0) + gap * explode * (layers.length - 1);
  let y = -total / 2;
  for (const L of layers) {
    L.g.position.y = y + L.t / 2;
    y += L.t + gap * explode;
    L.el.style.opacity = explode > 0.35 ? 1 : 0;
    L.el.style.pointerEvents = explode > 0.35 ? "auto" : "none";
    L.leader.visible = explode > 0.35;
  }
}

document.querySelectorAll("[data-model]").forEach((b) => (b.onclick = () => show(b.dataset.model)));
$("explode").oninput = (e) => { target = explode = +e.target.value; syncToggle(); };
$("toggle").onclick = () => { target = target > 0.5 ? 0 : 1; syncToggle(); };
$("spin").onclick = (e) => { controls.autoRotate = !controls.autoRotate; e.target.setAttribute("aria-pressed", controls.autoRotate); e.target.textContent = controls.autoRotate ? "Stop rotating" : "Auto-rotate"; };
$("reset").onclick = () => { camera.position.set(...current.cam); controls.target.set(-0.4, 0, 0); };
const syncToggle = () => ($("toggle").textContent = target > 0.5 ? "Collapse" : "Separate");

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down;
renderer.domElement.addEventListener("pointerdown", (e) => (down = [e.clientX, e.clientY]));
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(current.root.children, true).find((h) => h.object.isMesh && (selected === null || h.object.userData.layer === selected || !h.object.material.transparent || h.object.material.opacity > 0.5));
  select(hit ? hit.object.userData.layer : null);
});

new ResizeObserver(() => {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}).observe(stage);

show("supercap");
renderer.setAnimationLoop(() => {
  explode += (target - explode) * (reduce ? 1 : 0.12);
  $("explode").value = explode;
  layout();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
</body>
</html>
